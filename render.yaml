services:
  - type: web
    name: varsha-q
    runtime: python
    buildCommand: bash build.sh
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VARSHA_MODE
        value: DEMO
      - key: DEVICE
        value: cpu
      - key: PYTHONUNBUFFERED
        value: "1"
